[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webvault"
version = "0.1.0"
description = "Offline WARC archival toolbox for locally captured web responses"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Flask>=2.3"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
webvault = "webvault.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
webvault = ["web/templates/*.html", "web/static/*.css"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
